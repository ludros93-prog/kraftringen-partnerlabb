# Förberedd mall: ännu inte aktiverad eller körd i GitHub Actions.
# Efter verifierad repo-/Actionsåtkomst kan samordnaren kopiera filen till
# .github/workflows/quality.yml. Den publicerar ingenting och behöver inga secrets.
name: Partnerlabb QA

on:
  pull_request:
    paths:
      - 'dist/**'
      - 'qa/**'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'qa/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera JavaScript och QA-syntax
        run: |
          python - <<'PY'
          import pathlib, py_compile, subprocess
          for path in sorted(pathlib.Path('dist').rglob('*.js')):
              subprocess.run(['node', '--check', str(path)], check=True)
          for path in sorted(pathlib.Path('qa').glob('*.py')):
              py_compile.compile(str(path), doraise=True)
          PY
      - name: Installera testwebbläsare
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Starta lokal testserver
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/partnerlabb-http.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit('Den lokala testservern svarar inte.')
          PY
      - name: Kontrollera utkast och inflyttningskedja
        env:
          PARTNERLABB_QA_URL: http://127.0.0.1:8000/
        run: |
          python qa/movein-drafts.py
          python qa/movein-service.py
